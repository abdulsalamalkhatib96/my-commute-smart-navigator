name: Tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript modules
        run: |
          for file in *.mjs tests/*.mjs sw.js; do node --check "$file"; done
      - name: Run navigation helper tests
        run: node --test tests/*.test.mjs
      - name: Browser bootstrap smoke test (no Mapbox credentials)
        timeout-minutes: 2
        run: bash tests/browser-smoke.sh
