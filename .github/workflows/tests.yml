name: Tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: commute
          POSTGRES_PASSWORD: commute_test_only
          POSTGRES_DB: commute
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U commute -d commute"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript modules
        run: |
          for file in *.mjs tests/*.mjs sw.js; do node --check "$file"; done
      - name: Run navigation helper tests
        run: node --test tests/*.test.mjs
      - name: Install personal backend dependencies
        run: npm install --prefix backend --ignore-scripts --no-audit --no-fund
      - name: Test personal sync API, PostgreSQL CAS and Web Push
        env:
          DATABASE_URL: postgres://commute:commute_test_only@127.0.0.1:5432/commute
        run: node --test backend/tests/*.test.mjs
      - name: Validate optional self-hosted backend Compose specification
        env:
          PG_PASSWORD: ci_mock_password
          SYNC_API_TOKEN: ci_test_only_abcdefghijklmnopqrstuvwxyz123456
          VAPID_PUBLIC_KEY: ci-placeholder
          VAPID_PRIVATE_KEY: ci-placeholder
          VAPID_SUBJECT: mailto:ci@example.com
          API_DOMAIN: api.example.com
        run: docker compose -f backend/compose.yaml config --quiet
      - name: Browser bootstrap smoke test (no Mapbox credentials)
        timeout-minutes: 2
        run: bash tests/browser-smoke.sh
