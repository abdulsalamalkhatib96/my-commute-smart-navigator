name: Deploy website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node tests and release artifact consistency
        run: node --test tests/*.test.mjs && node --check app.mjs
      - name: Build safe static artifact
        run: |
          mkdir -p public/assets
          cp index.html privacy.html style.css app.mjs nav-core.mjs decision-core.mjs trip-store.mjs salik-core.mjs departure-core.mjs web-routing.mjs web-experience.mjs drive-mode.mjs departure-planner.mjs gps-policy.mjs reminder-core.mjs secure-backup.mjs api-budget.mjs public-config.mjs sw.js manifest.webmanifest public/
          cp assets/icon-192.png assets/icon-512.png public/assets/
          touch public/.nojekyll
      - name: Inject domain-restricted Mapbox public token into published artifact
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const value = process.env.MAPBOX_PUBLIC_TOKEN || '';
          if (value && !/^pk\\.[A-Za-z0-9._-]+$/.test(value)) throw new Error('MAPBOX_PUBLIC_TOKEN must be a public pk. token');
          fs.writeFileSync('public/public-config.mjs', 'export const MAPBOX_PUBLIC_TOKEN=' + JSON.stringify(value) + ';\\n');
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
