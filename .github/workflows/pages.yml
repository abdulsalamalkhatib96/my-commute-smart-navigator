name: Deploy website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node tests and release artifact consistency
        run: node --test tests/*.test.mjs && node --check app.mjs
      - name: Build safe static artifact
        run: |
          mkdir -p public/assets
          cp index.html style.css app.mjs nav-core.mjs decision-core.mjs trip-store.mjs salik-core.mjs departure-core.mjs web-routing.mjs web-experience.mjs drive-mode.mjs departure-planner.mjs gps-policy.mjs reminder-core.mjs secure-backup.mjs api-budget.mjs sw.js manifest.webmanifest public/
          cp assets/icon-192.png assets/icon-512.png public/assets/
          touch public/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
