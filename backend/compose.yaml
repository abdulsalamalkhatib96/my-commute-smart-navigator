services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: commute
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Set a strong password}
      POSTGRES_DB: commute
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commute -d commute"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - commute_data:/var/lib/postgresql/data
    networks: [internal]
  api:
    build: .
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://commute:${PG_PASSWORD}@database:5432/commute
      SYNC_API_TOKEN: ${SYNC_API_TOKEN:?Set private bearer token}
      WEB_ORIGIN: https://abdulsalamalkhatib96.github.io
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?Set VAPID keys}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?Set VAPID keys}
      VAPID_SUBJECT: ${VAPID_SUBJECT:?Set VAPID contact}
      PORT: "8080"
    networks: [internal]
  tls:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api]
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set DNS hostname for backend}
    ports: ["80:80","443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]
volumes:
  commute_data:
  caddy_data:
  caddy_config:
networks:
  internal:
